<title>Bonvoyラリー 育つ世界 モック v7</title>
<style>
  /* A案「Grand Resort Atlas」の動的合成検証。素材=assets/world、座標=design/proposals/world-atlas-anchors.json */
  :root{
    --navy:#1E2A44; --navy2:#2C3A57; --cream:#F4EBD8; --gold:#C9A85C; --stamp:#C6402F; --ground:#0E0D0B;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ground)}
  body{font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--cream);
    font-size:15px;line-height:1.6;padding:26px 10px 60px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .mocknote{font-size:11px;color:#A6906C;letter-spacing:.1em;text-align:center;max-width:390px}
  .mocknote b{color:#D9BE8C}
  .phone{width:100%;max-width:390px;border:1px solid #3A332A;border-radius:26px;overflow:hidden;
    box-shadow:0 12px 34px rgba(0,0,0,.6);position:relative;background:#1A1611}

  /* ===== 世界(ベース一枚絵 + 動的レイヤー) ===== */
  .world{position:relative;width:100%;overflow:hidden}
  .world img.base{width:100%;display:block}
  .layer{position:absolute;inset:0;pointer-events:none}
  /* 座標は自然画像(852x1842)に対する%で配置。サイズも幅%で指定し縮尺を保つ */
  .spr{position:absolute;transform:translate(-50%,-100%)}   /* 下端中央アンカー(建物・車) */
  .spr img{width:100%;display:block;filter:drop-shadow(0 6px 8px rgba(20,12,4,.45))}
  .stampov{position:absolute;transform:translate(-50%,-50%)}  /* 中心アンカー(判子) */
  .stampov svg{display:block;width:100%;height:auto;opacity:.92}
  @media (prefers-reduced-motion:no-preference){
    .spr.pop img{animation:build .7s cubic-bezier(.3,1.5,.4,1) backwards;transform-origin:50% 100%}
    @keyframes build{0%{transform:scale(.05);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1)}}
    .stampov.pop svg{animation:stampin .5s cubic-bezier(.2,1.6,.4,1) backwards}
    @keyframes stampin{0%{transform:scale(2.2);opacity:0}55%{transform:scale(.94);opacity:.92}100%{transform:scale(1)}}
    .spr.car{transition:left .7s cubic-bezier(.4,1.3,.5,1), top .7s cubic-bezier(.4,1.3,.5,1)}
  }
  .spark{position:absolute;color:#F5D98A;font-size:14px;animation:sp 1.1s ease-out forwards;pointer-events:none;
    transform:translate(-50%,-50%)}
  @keyframes sp{0%{opacity:0;translate:0 6px;scale:.6}25%{opacity:1}100%{opacity:0;translate:0 -30px;scale:1.2}}

  /* ===== HUDオーバーレイ ===== */
  .hud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:10px;
    background:rgba(30,42,68,.82);border:1px solid rgba(201,168,92,.5);border-radius:16px;
    padding:9px 14px;backdrop-filter:blur(3px)}
  .hud .n{font-size:24px;font-weight:800;font-family:ui-monospace,monospace;color:#F0D9A6;line-height:1}
  .hud .n small{font-size:10px;color:#C4B8A6;font-weight:700}
  .hud .sub{font-size:10.5px;color:#D9CDB8;line-height:1.4}
  .hud .sub b{color:#F0D9A6}
  .ctabar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center}
  .cta{flex:1;text-align:center;font-size:14px;font-weight:800;letter-spacing:.08em;padding:13px 0;
    border-radius:999px;border:1px solid rgba(201,168,92,.55);cursor:pointer;color:#F4EBD8;
    background:rgba(30,42,68,.88);backdrop-filter:blur(3px)}
  .cta:active{transform:translateY(1px)}
  .cta:disabled{opacity:.6}
  .reset{width:44px;padding:12px 0;text-align:center;border-radius:14px;border:1px solid rgba(201,168,92,.4);
    background:rgba(30,42,68,.8);color:#C9A85C;font-size:14px;cursor:pointer}
  .toastw{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.85);opacity:0;
    background:rgba(24,20,14,.92);border:1.5px solid var(--gold);border-radius:16px;padding:12px 20px;
    text-align:center;pointer-events:none;transition:all .4s;z-index:9}
  .toastw.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toastw .t1{font-family:"Hiragino Mincho ProN",serif;font-size:15px;color:#F0D9A6;letter-spacing:.08em}
  .toastw .t2{font-size:10.5px;color:#C4B8A6;margin-top:2px}
  .screenlabel{font-size:10px;letter-spacing:.25em;color:#A6906C;text-align:center;margin-top:4px}
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms!important;animation:none!important} }
</style>

<p class="mocknote"><b>【モック v7】</b>A案「育つ世界」の動的合成検証。<b>「宿泊を記録」を押すたびに1件の宿泊が刻まれ、初めての宿は世界にミニチュアが建ちます</b>。データはダミー（2026年の5宿8泊）。</p>

<div class="phone">
  <div class="world" id="world">
    <img class="base" src="../assets/world/base-atlas-unbuilt.webp" alt="育つ前の世界">
    <div class="layer" id="hotels"></div>
    <div class="layer" id="stamps"></div>
    <div class="layer" id="cars"></div>
    <div class="layer" id="fx"></div>
  </div>
  <div class="hud">
    <span class="n" id="nights">0<small>泊</small></span>
    <div class="sub" id="hudsub">2026年の世界はまだ更地。<b>最初の宿泊を記録しよう</b></div>
  </div>
  <div class="toastw" id="toastw"><div class="t1" id="tw1"></div><div class="t2" id="tw2"></div></div>
  <div class="ctabar">
    <button class="cta" id="go">宿泊を記録（デモ）</button>
    <button class="reset" id="reset" title="最初から">↺</button>
  </div>
</div>
<p class="screenlabel">記録タブ = 育つ世界（A案 実素材・座標契約に基づく動的合成）</p>

<script>
"use strict";
/* ---- 座標契約 (world-atlas-anchors.json より) ---- */
const IMG_W=852, IMG_H=1842;
const SQ={1:[427,1590],2:[425,1453],3:[370,1327],4:[412,1205],5:[450,1088],6:[448,974],7:[421,860],8:[421,751],9:[441,661],10:[446,585],11:[419,525],12:[438,470]};
const LOTS={
  "moxy-osaka":     {x:668,y:466, w:390*0.24, img:"hotel-moxy-osaka.webp"},
  "izu-marriott":   {x:423,y:380, w:512*0.27, img:"hotel-izu-marriott.webp"},
  "cy-nagoya":      {x:108,y:752, w:512*0.29, img:"hotel-courtyard-nagoya.webp"},
  "w-osaka":        {x:704,y:798, w:397*0.31, img:"hotel-w-osaka.webp"},
  "jw-phuket":      {x:126,y:1108,w:497*0.43, img:"hotel-jw-phuket.webp"}
};
const CARS={ shun:{w:512*0.20,img:"pawn-shun-m3.webp",off:-26}, sayano:{w:512*0.18,img:"pawn-sayano-220.webp",off:30} };
/* ダミー宿泊シーケンス(2026年) */
const STAYS=[
  {hotel:"moxy-osaka",   name:"モクシー大阪本町",     ch:"モ",shape:"sq",  n:1, d:"1/17"},
  {hotel:"izu-marriott", name:"伊豆マリオット修善寺", ch:"伊",shape:"circ",n:2, d:"2/21"},
  {hotel:"cy-nagoya",    name:"コートヤード名古屋",   ch:"コ",shape:"sq",  n:1, d:"4/10"},
  {hotel:"w-osaka",      name:"W大阪",                ch:"W", shape:"hex", n:1, d:"5/2"},
  {hotel:"jw-phuket",    name:"JWマリオット・プーケット",ch:"J",shape:"hex",n:3, d:"8/8"}
];
const pct=(v,base)=>(v/base*100)+"%";
const px2wPct=v=>pct(v,IMG_W);

function seal(ch,shape,rot){
  const ink="#C6402F";
  let f;
  if(shape==="hex") f='<polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="none" stroke="'+ink+'" stroke-width="5"/><polygon points="0,-26 23,-13 23,13 0,26 -23,13 -23,-13" fill="none" stroke="'+ink+'" stroke-width="1.4"/>';
  else if(shape==="sq") f='<rect x="-31" y="-31" width="62" height="62" rx="6" fill="none" stroke="'+ink+'" stroke-width="5"/><rect x="-24" y="-24" width="48" height="48" fill="none" stroke="'+ink+'" stroke-width="1.4"/>';
  else f='<circle r="33" fill="none" stroke="'+ink+'" stroke-width="5"/><circle r="26" fill="none" stroke="'+ink+'" stroke-width="1.4"/>';
  return '<svg viewBox="-45 -45 90 90"><g transform="rotate('+rot+')">'+f+
    '<text y="13" text-anchor="middle" font-size="36" font-weight="800" fill="'+ink+'" font-family="Hiragino Mincho ProN,Yu Mincho,serif">'+ch+'</text></g></svg>';
}

const hotelsL=document.getElementById("hotels"), stampsL=document.getElementById("stamps"),
      carsL=document.getElementById("cars"), fxL=document.getElementById("fx"),
      nightsEl=document.getElementById("nights"), hudsub=document.getElementById("hudsub"),
      toastw=document.getElementById("toastw");
let idx=0, night=0;

function carHtml(key){
  const c=CARS[key];
  return '<span class="spr car" id="car-'+key+'" style="width:'+px2wPct(c.w)+'">'+
    '<img src="../assets/world/'+c.img+'" alt=""></span>';
}
function placeCar(key,sq){
  const el=document.getElementById("car-"+key), p=SQ[sq], c=CARS[key];
  el.style.left=pct(p[0]+c.off,IMG_W); el.style.top=pct(p[1]+34,IMG_H);
}
function sparkleAt(x,y){
  for(let i=0;i<8;i++){
    const s=document.createElement("span"); s.className="spark"; s.textContent="✦";
    s.style.left=pct(x+(Math.random()*80-40),IMG_W); s.style.top=pct(y-30+(Math.random()*50-25),IMG_H);
    s.style.animationDelay=(Math.random()*.4)+"s";
    fxL.appendChild(s); setTimeout(()=>s.remove(),1800);
  }
}
function toast(t1,t2){
  document.getElementById("tw1").textContent=t1; document.getElementById("tw2").textContent=t2;
  toastw.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>toastw.classList.remove("on"),2200);
}
function init(){
  hotelsL.innerHTML=""; stampsL.innerHTML=""; fxL.innerHTML="";
  carsL.innerHTML=carHtml("shun")+carHtml("sayano");
  idx=0; night=0;
  placeCar("shun",1); placeCar("sayano",1);
  nightsEl.innerHTML='0<small>泊</small>';
  hudsub.innerHTML='2026年の世界はまだ更地。<b>最初の宿泊を記録しよう</b>';
  document.getElementById("go").disabled=false;
  document.getElementById("go").textContent="宿泊を記録（デモ）";
}
document.getElementById("go").addEventListener("click",()=>{
  if(idx>=STAYS.length) return;
  const st=STAYS[idx];
  /* 泊数ぶん判子が押され、車が進む */
  for(let k=0;k<st.n;k++){
    const sq=night+k+1, p=SQ[sq];
    if(!p) break;
    const size=88; /* 画像px相当の判子径 */
    setTimeout(()=>{
      stampsL.insertAdjacentHTML("beforeend",
        '<span class="stampov pop" style="left:'+pct(p[0],IMG_W)+';top:'+pct(p[1],IMG_H)+';width:'+px2wPct(size)+'">'+
        seal(st.ch,st.shape,((sq*37)%9)-4)+'</span>');
    }, k*350);
  }
  night=Math.min(night+st.n,12); idx++;
  setTimeout(()=>{ placeCar("shun",night); placeCar("sayano",Math.max(1,night-3)); }, st.n*350);
  /* 初めての宿 → 世界にミニチュアが建つ */
  const lot=LOTS[st.hotel];
  setTimeout(()=>{
    hotelsL.insertAdjacentHTML("beforeend",
      '<span class="spr pop" style="left:'+pct(lot.x,IMG_W)+';top:'+pct(lot.y,IMG_H)+';width:'+px2wPct(lot.w)+'">'+
      '<img src="../assets/world/'+lot.img+'" alt="'+st.name+'"></span>');
    sparkleAt(lot.x,lot.y-40);
    toast(st.name+" が建った", st.d+"・"+st.n+"泊");
  }, st.n*350+250);

  nightsEl.innerHTML=night+'<small>泊</small>';
  const left=10-night;
  hudsub.innerHTML= left>0 ? "5宿・シルバーまで <b>あと"+left+"泊</b>" : "<b>シルバーエリート達成！</b>";
  if(idx>=STAYS.length){
    document.getElementById("go").textContent="（デモはここまで・↺で最初から）";
    document.getElementById("go").disabled=true;
  }
});
document.getElementById("reset").addEventListener("click",init);
init();
</script>
