<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bonvoy Rally Vertical Slice Preview</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #071834;
    }

    body {
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .scene {
      position: relative;
      width: min(390px, 100vw);
      aspect-ratio: 390 / 474;
      overflow: hidden;
      background: #f4efe4;
      isolation: isolate;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .haze {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 44%, rgba(244, 239, 228, 0.16) 66%, rgba(7, 24, 52, 0.2));
    }

    .path {
      position: absolute;
      inset: 0;
      filter: drop-shadow(0 8px 8px rgba(7, 24, 52, 0.24));
    }

    .tile {
      position: absolute;
      width: 88px;
      aspect-ratio: 1;
      transform: rotate(45deg) scaleY(0.58);
    }

    .tile:nth-child(1) { left: 27px; bottom: 26px; }
    .tile:nth-child(2) { left: 88px; bottom: 57px; }
    .tile:nth-child(3) { left: 149px; bottom: 88px; }
    .tile:nth-child(4) { left: 210px; bottom: 119px; }
    .tile:nth-child(5) { left: 271px; bottom: 150px; }

    .gate {
      position: absolute;
      width: 174px;
      height: 174px;
      right: 6px;
      bottom: 156px;
      object-fit: contain;
      filter: drop-shadow(0 8px 5px rgba(7, 24, 52, 0.28));
    }

    .pawn {
      position: absolute;
      width: 114px;
      height: 114px;
      object-fit: contain;
      filter: drop-shadow(0 7px 4px rgba(7, 24, 52, 0.36));
    }

    .pawn-shun { left: 36px; bottom: 52px; }
    .pawn-sayano { left: 137px; bottom: 102px; }
  </style>
</head>
<body>
  <main class="scene" aria-label="Bonvoy Rally daylight vertical slice">
    <img class="background" src="../assets/vertical-slice/background-day-resort.webp" alt="">
    <div class="haze"></div>
    <div class="path" aria-hidden="true">
      <img class="tile" src="../assets/vertical-slice/tile-cream-marble.webp" alt="">
      <img class="tile" src="../assets/vertical-slice/tile-cream-marble.webp" alt="">
      <img class="tile" src="../assets/vertical-slice/tile-cream-marble.webp" alt="">
      <img class="tile" src="../assets/vertical-slice/tile-cream-marble.webp" alt="">
      <img class="tile" src="../assets/vertical-slice/tile-cream-marble.webp" alt="">
    </div>
    <img class="gate" src="../assets/vertical-slice/gate-silver.webp" alt="">
    <img class="pawn pawn-shun" src="../assets/vertical-slice/pawn-shun-m3-touring.webp" alt="">
    <img class="pawn pawn-sayano" src="../assets/vertical-slice/pawn-sayano-220-coupe.webp" alt="">
  </main>
</body>
</html>
